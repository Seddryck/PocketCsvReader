name: CI and release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1

jobs:
  version:
    name: Calculate version
    runs-on: windows-2025
    outputs:
      patch: ${{ steps.gitversion.outputs.patch }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml
          verbosity: minimal

  test:
    name: Test ${{ matrix.test.name }} (${{ matrix.framework }})
    needs: version
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net8.0
          - net9.0
          - net10.0
        test:
          - name: PocketCsvReader
            artifact: core
            project: PocketCsvReader.Testing/PocketCsvReader.Testing.csproj
            include: '[PocketCsvReader]*'
          - name: PocketCsvReader.Ndjson
            artifact: ndjson
            project: PocketCsvReader.Ndjson.Testing/PocketCsvReader.Ndjson.Testing.csproj
            include: '[PocketCsvReader*]*'
          - name: PocketCsvReader.FixedWidth
            artifact: fixed-width
            project: PocketCsvReader.FixedWidth.Testing/PocketCsvReader.FixedWidth.Testing.csproj
            include: '[PocketCsvReader.FixedWidth]*'
          - name: PocketCsvReader.KeyValue
            artifact: key-value
            project: PocketCsvReader.KeyValue.Testing/PocketCsvReader.KeyValue.Testing.csproj
            include: '[PocketCsvReader.KeyValue]*'
          - name: PocketCsvReader.WebLogs
            artifact: web-logs
            project: PocketCsvReader.WebLogs.Testing/PocketCsvReader.WebLogs.Testing.csproj
            include: '[PocketCsvReader.WebLogs]*'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDKs and runtimes
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.test.project }} --nologo

      - name: Build
        run: >-
          dotnet build ${{ matrix.test.project }}
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-restore
          --nologo
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ needs.version.outputs.semVer }}

      - name: Test
        shell: pwsh
        run: >-
          dotnet test
          --project ${{ matrix.test.project }}
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-build
          --results-directory artifacts/test-results
          --
          --report-trx
          --report-trx-filename "${{ matrix.test.name }}.${{ matrix.framework }}.trx"
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-include "${{ matrix.test.include }}"

      - name: Normalize coverage
        shell: pwsh
        env:
          COVERAGE_NAME: ${{ matrix.test.name }}.${{ matrix.framework }}.cobertura.xml
        run: |
          $coverageFiles = @(Get-ChildItem artifacts/test-results -Recurse -Filter *.cobertura.*.xml -File)
          if ($coverageFiles.Count -ne 1) {
            throw "Expected one coverage report, found $($coverageFiles.Count)."
          }

          New-Item -ItemType Directory -Force artifacts/coverage | Out-Null
          Copy-Item -LiteralPath $coverageFiles[0].FullName -Destination "artifacts/coverage/$env:COVERAGE_NAME"

      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.test.artifact }}-${{ matrix.framework }}
          path: |
            artifacts/coverage
            artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14

  coverage-threshold:
    name: Validate coverage threshold
    needs: test
    runs-on: windows-2025
    steps:
      - name: Download coverage results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: artifacts
          merge-multiple: true

      - name: Require 10% line coverage
        shell: pwsh
        run: |
          $coverageFiles = @(Get-ChildItem artifacts/coverage -Filter *.xml -File)
          if ($coverageFiles.Count -eq 0) {
            throw 'No coverage reports were found.'
          }

          $failures = foreach ($coverageFile in $coverageFiles) {
            [xml]$report = Get-Content -LiteralPath $coverageFile.FullName
            $lineRate = [double]::Parse(
              [string]$report.coverage.'line-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            if ($lineRate -lt 0.10) {
              "$($coverageFile.Name): $($lineRate * 100)%"
            }
          }

          if ($failures.Count -gt 0) {
            throw "Line coverage is below the required 10%:`n$($failures -join "`n")"
          }

  coverage:
    name: Upload coverage
    needs: test
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download coverage results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: artifacts
          merge-multiple: true

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: artifacts/coverage/*.xml
          use_oidc: true

  package:
    name: Package ${{ matrix.package.name }}
    needs:
      - version
      - coverage
      - coverage-threshold
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: PocketCsvReader
            artifact: core
            project: PocketCsvReader/PocketCsvReader.csproj
          - name: PocketCsvReader.Ndjson
            artifact: ndjson
            project: PocketCsvReader.Ndjson/PocketCsvReader.Ndjson.csproj
          - name: PocketCsvReader.FixedWidth
            artifact: fixed-width
            project: PocketCsvReader.FixedWidth/PocketCsvReader.FixedWidth.csproj
          - name: PocketCsvReader.KeyValue
            artifact: key-value
            project: PocketCsvReader.KeyValue/PocketCsvReader.KeyValue.csproj
          - name: PocketCsvReader.WebLogs
            artifact: web-logs
            project: PocketCsvReader.WebLogs/PocketCsvReader.WebLogs.csproj
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: >-
          dotnet restore ${{ matrix.package.project }}
          --nologo

      - name: Pack NuGet package
        run: >-
          dotnet pack ${{ matrix.package.project }}
          --configuration Release
          --no-restore
          --include-symbols
          --output artifacts/packages
          --nologo
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ needs.version.outputs.semVer }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package-${{ matrix.package.artifact }}-${{ needs.version.outputs.semVer }}
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 30

  validate-packages:
    name: Validate packages
    needs:
      - version
      - package
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-package-*-${{ needs.version.outputs.semVer }}
          path: artifacts/packages
          merge-multiple: true

      - name: Validate NuGet packages
        shell: pwsh
        run: >-
          .github/scripts/Validate-Packages.ps1
          -Version '${{ needs.version.outputs.semVer }}'
          -PackageDirectory artifacts/packages

      - name: Upload immutable NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ needs.version.outputs.semVer }}
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish packages and release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - version
      - validate-packages
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Download tested NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-${{ needs.version.outputs.semVer }}
          path: artifacts/packages

      - name: Revalidate complete package set
        shell: pwsh
        run: >-
          .github/scripts/Validate-Packages.ps1
          -Version '${{ needs.version.outputs.semVer }}'
          -PackageDirectory artifacts/packages

      - name: Reserve minor or major release tag
        if: needs.version.outputs.patch == '0'
        shell: pwsh
        env:
          RELEASE_TAG: v${{ needs.version.outputs.semVer }}
        run: |
          git fetch origin --tags --force
          $existingTag = git tag --list $env:RELEASE_TAG

          if ($existingTag) {
            $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $env:RELEASE_TAG identifies $tagCommit instead of $env:GITHUB_SHA."
            }
          }
          else {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            git push origin "refs/tags/$env:RELEASE_TAG"
          }

      - name: Request short-lived NuGet credential
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Seddryck

      - name: Publish NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem artifacts/packages -Filter *.nupkg -File |
            Where-Object Extension -EQ '.nupkg' |
            Where-Object Name -NotLike '*.snupkg'

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Create GitHub release
        if: needs.version.outputs.patch == '0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.version.outputs.semVer }}
          RELEASE_VERSION: ${{ needs.version.outputs.semVer }}
        run: |
          if (gh release view $env:RELEASE_TAG 2>$null) {
            Write-Host "Release $env:RELEASE_TAG already exists."
          }
          else {
            gh release create $env:RELEASE_TAG `
              --verify-tag `
              --title "PocketCsvReader $env:RELEASE_VERSION" `
              --generate-notes `
              --discussion-category Announcements
          }
