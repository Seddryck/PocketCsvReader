name: CI and release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1

jobs:
  version:
    name: Calculate version
    runs-on: windows-2025
    outputs:
      patch: ${{ steps.gitversion.outputs.patch }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml
          verbosity: minimal

  build-test-package:
    name: Build, test, and package
    needs: version
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore PocketCsvReader.full.sln --nologo

      - name: Build
        run: >-
          dotnet build PocketCsvReader.full.sln
          --configuration Release
          --no-restore
          --nologo
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ needs.version.outputs.semVer }}

      - name: Test every supported target framework
        shell: pwsh
        run: .github/scripts/Invoke-Tests.ps1

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: artifacts/coverage/*.xml
          use_oidc: true

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $projects = @(
            'PocketCsvReader/PocketCsvReader.csproj',
            'PocketCsvReader.Ndjson/PocketCsvReader.Ndjson.csproj',
            'PocketCsvReader.FixedWidth/PocketCsvReader.FixedWidth.csproj',
            'PocketCsvReader.KeyValue/PocketCsvReader.KeyValue.csproj',
            'PocketCsvReader.WebLogs/PocketCsvReader.WebLogs.csproj'
          )

          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration Release `
              --no-build `
              --no-restore `
              --include-symbols `
              --output artifacts/packages `
              --nologo `
              -p:Version=${{ needs.version.outputs.semVer }}

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Validate NuGet packages
        shell: pwsh
        run: >-
          .github/scripts/Validate-Packages.ps1
          -Version '${{ needs.version.outputs.semVer }}'
          -PackageDirectory artifacts/packages

      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ needs.version.outputs.semVer }}
          path: |
            artifacts/coverage
            artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload immutable NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ needs.version.outputs.semVer }}
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish packages and release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - version
      - build-test-package
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Download tested NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-${{ needs.version.outputs.semVer }}
          path: artifacts/packages

      - name: Revalidate complete package set
        shell: pwsh
        run: >-
          .github/scripts/Validate-Packages.ps1
          -Version '${{ needs.version.outputs.semVer }}'
          -PackageDirectory artifacts/packages

      - name: Reserve minor or major release tag
        if: needs.version.outputs.patch == '0'
        shell: pwsh
        env:
          RELEASE_TAG: v${{ needs.version.outputs.semVer }}
        run: |
          git fetch origin --tags --force
          $existingTag = git tag --list $env:RELEASE_TAG

          if ($existingTag) {
            $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $env:RELEASE_TAG identifies $tagCommit instead of $env:GITHUB_SHA."
            }
          }
          else {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            git push origin "refs/tags/$env:RELEASE_TAG"
          }

      - name: Request short-lived NuGet credential
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Seddryck

      - name: Publish NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem artifacts/packages -Filter *.nupkg -File |
            Where-Object Extension -EQ '.nupkg' |
            Where-Object Name -NotLike '*.snupkg'

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Create GitHub release
        if: needs.version.outputs.patch == '0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.version.outputs.semVer }}
          RELEASE_VERSION: ${{ needs.version.outputs.semVer }}
        run: |
          if (gh release view $env:RELEASE_TAG 2>$null) {
            Write-Host "Release $env:RELEASE_TAG already exists."
          }
          else {
            gh release create $env:RELEASE_TAG `
              --verify-tag `
              --title "PocketCsvReader $env:RELEASE_VERSION" `
              --generate-notes `
              --discussion-category Announcements
          }
