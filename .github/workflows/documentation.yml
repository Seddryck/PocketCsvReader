name: Documentation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  documentation:
    name: Examples, Jekyll, and internal links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test documentation validation
        run: python3 -m unittest discover -s .github/tools -p 'test_check_docs.py'
      - name: Check navigation and compile runnable examples
        run: python3 .github/tools/check_docs.py --examples
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.3'
          bundler: '2.3.18'
          bundler-cache: true
          working-directory: docs
      - name: Build Jekyll with production base path
        working-directory: docs
        run: bundle exec jekyll build --strict_front_matter --destination ../artifacts/docs-site
      - name: Check rendered routes and anchors
        run: python3 .github/tools/check_docs.py --site artifacts/docs-site
      - name: Retain rendered preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: artifacts/docs-site
