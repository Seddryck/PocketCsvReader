  - 'Row numbers, source positions, UTF-8 CSV input, parsed dictionaries/arrays, JSON record paths, Chrononuensis, and span custom parsers. <a href="https://github.com/Seddryck/PocketCsvReader/pull/352">#352</a>, <a href="https://github.com/Seddryck/PocketCsvReader/pull/350">#350</a>, <a href="https://github.com/Seddryck/PocketCsvReader/pull/345">#345</a>, <a href="https://github.com/Seddryck/PocketCsvReader/pull/344">#344</a>, <a href="https://github.com/Seddryck/PocketCsvReader/pull/343">#343</a>, <a href="https://github.com/Seddryck/PocketCsvReader/pull/342">#342</a>, <a href="https://github.com/Seddryck/PocketCsvReader/pull/340">#340</a>'
- title: Schema and dialect discovery
  date: Oct 11, 2026
  list:
  - 'Opt-in inference with bounded sampling and diagnostics. <a href="https://github.com/Seddryck/PocketCsvReader/pull/334">#334</a>'
- title: Analytics and JSON projection
  date: Oct 8, 2026
  list:
  - 'Apache Arrow batches, ordinary/ordered JSON and NDJSON projection, and trusted stable-object shapes. <a href="https://github.com/Seddryck/PocketCsvReader/pull/330">#330</a>'


